name: HDU Library SeatHunter

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'    # 15:00 CST; log in early, then wait for the 20:00 boundary

permissions:
  contents: read

concurrency:
  group: hdu-library-seathunter
  cancel-in-progress: false

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Validate configuration
        run: python -m unittest discover -s tests -v

      - name: Book seat
        env:
          SEATHUNTER_LOGIN_NAME: ${{ secrets.SCHOOL_ID }}
          SEATHUNTER_PASSWORD: ${{ secrets.PASSWORD }}
        run: python main.py --once --config config/ci.yaml

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: seathunter-logs-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 3
