name: Temporary HDU Login Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-login:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check login and UID without booking
        env:
          SEATHUNTER_LOGIN_NAME: ${{ secrets.SCHOOL_ID }}
          SEATHUNTER_PASSWORD: ${{ secrets.PASSWORD }}
        run: python main.py --check-login --config config/ci.yaml

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: login-check-logs-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 3
