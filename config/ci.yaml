# GitHub Actions configuration. Credentials come from repository Secrets and
# must not be written in this file.
user:
  login_name: ""
  password: ""
  org_id: "104"

plans:
  - id: "daily_seat_216"
    room_name: "自定义"
    floor_name: "自定义"
    begin_time: "10:00:00"
    duration_hours: 11
    seats:
      - seat_id: "62561"
        seat_num: "421"

# target_weekdays uses 1=Monday through 7=Sunday for the target seat date.
schedules:
  - mode: weekdays
    target_weekdays: [1, 2, 3, 4, 5, 6, 7]
    plan_ids: ["daily_seat_216"]
    enabled: true

settings:
  interval: 2.0
  # The first booking POST is held until 20:00:00.  Retry at most once per
  # second during the opening burst; rate-limit responses back off smoothly.
  burst_interval: 1.0
  burst_from: "20:00:00"
  burst_to: "20:05:00"
  rate_limit_max_interval: 12.0
  retry_jitter_ratio: 0.15
  # Safety upper bound; 2000 one-second attempts extend well past the deadline,
  # so booking_deadline remains the effective stop condition.
  max_try_times: 2000
  auto_relogin: true
  # Validate the session five minutes before opening. The second repository
  # uses a different lead so the two accounts do not re-enter CAS together.
  session_refresh_lead_seconds: 300
  # Never spend the request budget before seats are released.
  booking_open_time: "20:00:00"
  # Stop retrying at 20:15, as the pre-rewrite script did. A run dispatched
  # after this exits without booking instead of firing hopeless requests.
  booking_deadline: "20:15:00"

api:
  base_url: "https://hdu.huitu.zhishulib.com"

session:
  headers:
    Accept: "*/*"
    Accept-Encoding: "gzip, deflate"
    Accept-Language: "zh-CN,zh;q=0.9"
    Cache-Control: "no-cache"
    Connection: "keep-alive"
    Pragma: "no-cache"
    Referer: "https://hdu.huitu.zhishulib.com/"
    Sec-Fetch-Dest: "empty"
    Sec-Fetch-Mode: "no-cors"
    Sec-Fetch-Site: "same-origin"
    User-Agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
  params:
    LAB_JSON: "1"
  trust_env: false
  verify: false
