# GitHub Actions configuration. Credentials come from repository Secrets and
# must not be written in this file.
user:
  login_name: ""
  password: ""
  org_id: "104"

plans:
  - id: "daily_seat_216"
    room_name: "自定义"
    floor_name: "自定义"
    begin_time: "10:00:00"
    duration_hours: 11
    seats:
      - seat_id: "62561"
        seat_num: "421"

# target_weekdays uses 1=Monday through 7=Sunday for the target seat date.
schedules:
  - mode: weekdays
    target_weekdays: [1, 2, 3, 4, 5, 6, 7]
    plan_ids: ["daily_seat_216"]
    enabled: true

settings:
  interval: 5
  # Tighten to 2s around the release so attempts land densely at 20:00.
  burst_interval: 2
  burst_from: "19:58:00"
  burst_to: "20:05:00"
  # Upper bound only; booking_deadline is what actually ends the run.
  max_try_times: 400
  auto_relogin: true
  # Seats are released at 20:00 sharp. Start 5 minutes early so a request is
  # already in flight when the window opens, without spending long stretches
  # of pointless traffic beforehand.
  booking_open_time: "19:55:00"
  # Stop retrying at 20:15, as the pre-rewrite script did. A run dispatched
  # after this exits without booking instead of firing hopeless requests.
  booking_deadline: "20:15:00"

api:
  base_url: "https://hdu.huitu.zhishulib.com"

session:
  headers:
    Accept: "*/*"
    Accept-Encoding: "gzip, deflate"
    Accept-Language: "zh-CN,zh;q=0.9"
    Cache-Control: "no-cache"
    Connection: "keep-alive"
    Pragma: "no-cache"
    Referer: "https://hdu.huitu.zhishulib.com/"
    Sec-Fetch-Dest: "empty"
    Sec-Fetch-Mode: "no-cors"
    Sec-Fetch-Site: "same-origin"
    User-Agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
  params:
    LAB_JSON: "1"
  trust_env: false
  verify: false
