# GitHub Actions configuration. Credentials come from repository Secrets and
# must not be written in this file.
user:
  login_name: ""
  password: ""
  org_id: "104"

plans:
  - id: "daily_seat_216"
    room_name: "自定义"
    floor_name: "自定义"
    begin_time: "10:00:00"
    duration_hours: 11
    seats:
      - seat_id: "62561"
        seat_num: "421"

# target_weekdays uses 1=Monday through 7=Sunday for the target seat date.
schedules:
  - mode: weekdays
    target_weekdays: [1, 2, 3, 4, 5, 6, 7]
    plan_ids: ["daily_seat_216"]
    enabled: true

settings:
  interval: 5.0
  # Logs show that starts roughly two seconds apart alternate between accepted
  # and rate-limited, while accepted starts are about 4.4 seconds apart. Hold
  # the first POST until 20:00:00, then keep at least 4.2 seconds between starts.
  burst_interval: 4.2
  burst_from: "20:00:00"
  burst_to: "20:05:00"
  # A rate-limited request did not reset the observed server cooldown, so probe
  # briefly instead of applying a long penalty after CODE=1/429.
  rate_limit_probe_interval: 1.0
  retry_jitter_ratio: 0.15
  # Safety upper bound; booking_deadline remains the effective stop condition.
  max_try_times: 2000
  auto_relogin: true
  # Validate at 19:48. The second repository validates two minutes earlier so
  # the two accounts do not re-enter CAS together.
  session_refresh_lead_seconds: 720
  # Retry transient CAS/session failures slowly instead of hammering login.
  login_max_attempts: 3
  login_retry_initial_delay_seconds: 30.0
  login_retry_max_delay_seconds: 90.0
  login_retry_jitter_ratio: 0.15
  # Never spend the request budget before seats are released.
  booking_open_time: "20:00:00"
  # Stop retrying at 20:15, as the pre-rewrite script did. A run dispatched
  # after this exits without booking instead of firing hopeless requests.
  booking_deadline: "20:15:00"

api:
  base_url: "https://hdu.huitu.zhishulib.com"

session:
  headers:
    Accept: "*/*"
    Accept-Encoding: "gzip, deflate"
    Accept-Language: "zh-CN,zh;q=0.9"
    Cache-Control: "no-cache"
    Connection: "keep-alive"
    Pragma: "no-cache"
    Referer: "https://hdu.huitu.zhishulib.com/"
    Sec-Fetch-Dest: "empty"
    Sec-Fetch-Mode: "no-cors"
    Sec-Fetch-Site: "same-origin"
    User-Agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
  params:
    LAB_JSON: "1"
  trust_env: false
  verify: false
